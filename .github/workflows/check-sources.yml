name: בדיקת מקורות

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev
      - run: node scripts/check-sources.mjs
      - run: node scripts/check-telegram.mjs
