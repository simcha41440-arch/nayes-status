name: ייצוא תמונות וסרטונים
on: workflow_dispatch
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/export-media.mjs media
      - name: שמירה בענף media-export
        run: |
          cd media
          git init -q -b media-export
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "תמונות וסרטונים"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" media-export
