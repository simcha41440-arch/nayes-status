name: צילומי מסך
on:
  workflow_dispatch:
    inputs:
      slug: { description: "צילום של מבזק אחד (לא חובה)", required: false, default: "" }
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/screenshots.cjs shots
        env:
          ONLY_SLUG: ${{ inputs.slug }}
      - name: שמירה בענף screenshots
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "צילומי מסך"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots
