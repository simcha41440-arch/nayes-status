name: ניסיון עם חדשות אמיתיות
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev && npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node pipeline/run.mjs
        env:
          DRY_RUN: "true"
          DRY_FILE: dry.json
          MAX_PER_RUN: "10"
          MAX_AGE_HOURS: "6"
          AUTO_PUBLISH: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - run: node scripts/preview.mjs preview
        env:
          DRY_FILE: dry.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      - name: שמירה בענף preview
        run: |
          cp dry.json preview/ && cd preview && rm -rf media
          git init -q -b preview && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "ניסיון עם חדשות אמיתיות"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" preview
